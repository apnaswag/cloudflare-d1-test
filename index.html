<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <form id="multiStepForm">
        <div class="step active" id="step1">
            <h2>Personal Details</h2>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <div class="dob-group">
                    <input type="number" id="dob_dd" placeholder="DD" min="1" max="31" required>
                    <input type="number" id="dob_mm" placeholder="MM" min="1" max="12" required>
                    <input type="number" id="dob_yyyy" placeholder="YYYY" min="1900" max="2100" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com">
            </div>
            <button type="button" class="btn-next" onclick="nextStep(1)">Next</button>
        </div>

        <div class="step" id="step2">
            <h2>Location</h2>
            <div class="form-group">
                <label for="pincode">Pin Code</label>
                <input type="number" id="pincode" name="pincode" required placeholder="6-digit pin code">
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <select id="state" name="state" required>
                    <option value="" disabled selected>Select State</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                    <option value="Assam">Assam</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Chhattisgarh">Chhattisgarh</option>
                    <option value="Goa">Goa</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                    <option value="Jharkhand">Jharkhand</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Manipur">Manipur</option>
                    <option value="Meghalaya">Meghalaya</option>
                    <option value="Mizoram">Mizoram</option>
                    <option value="Nagaland">Nagaland</option>
                    <option value="Odisha">Odisha</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Sikkim">Sikkim</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Tripura">Tripura</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Uttarakhand">Uttarakhand</option>
                    <option value="West Bengal">West Bengal</option>
                    <option value="Delhi">Delhi</option>
                    </select>
            </div>
            <div class="btn-group">
                <button type="button" class="btn-prev" onclick="prevStep(2)">Back</button>
                <button type="button" class="btn-next" onclick="nextStep(2)">Next</button>
            </div>
        </div>

        <div class="step" id="step3">
            <h2>Education</h2>
            <div class="form-group">
                <label for="qualification">Highest Qualification</label>
                <select id="qualification" name="qualification" required>
                    <option value="" disabled selected>Select Qualification</option>
                    <option value="12th Pass">12th Pass</option>
                    <option value="Under Graduation">Under Graduation</option>
                    <option value="Post Graduation">Post Graduation</option>
                </select>
            </div>
            <div class="form-group">
                <label for="marks">Total Percent / CGPA</label>
                <input type="text" id="marks" name="marks" required placeholder="e.g. 85% or 8.5 CGPA">
            </div>
            <div class="error-msg" id="errorMsg"></div>
            <div class="btn-group">
                <button type="button" class="btn-prev" onclick="prevStep(3)">Back</button>
                <button type="button" class="btn-submit" onclick="submitForm()">Submit</button>
            </div>
        </div>

        <div class="step success-step" id="step4">
            <div class="tick-icon">✔</div>
            <h2>Registered Successfully!</h2>
            <p>Your details have been saved.</p>
        </div>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
